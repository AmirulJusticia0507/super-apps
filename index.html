<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Apps — Amirul Putra Justicia</title>
<meta name="description" content="Katalog & launcher super apps untuk seluruh project personal Amirul Putra Justicia." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
<style>
  :root {
    --bg: #0b0f17;
    --surface: #121826;
    --surface-2: #1a2233;
    --border: #243044;
    --text: #e8eef7;
    --muted: #8fa0b8;
    --accent: #6366f1;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --surface-raised: #171f30;
    --accent-soft: rgba(99,102,241,.12);
    --security-clear: #34d399;
    --security-attention: #fbbf24;
    --security-critical: #fb7185;
  }
  [data-theme="light"] {
    --bg: #f6f8fc; --surface: #ffffff; --surface-2: #eef2f9;
    --border: #dce4f0; --text: #101828; --muted: #5a6b85;
    --shadow: 0 8px 24px rgba(16,24,40,.08);
    --surface-raised: #f8faff; --accent-soft: rgba(99,102,241,.08);
    --security-clear: #047857;
    --security-attention: #b45309;
    --security-critical: #be123c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  header { padding: 34px 24px 0; max-width: 1280px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); font-size: 22px;
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .82rem; margin-top: 4px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { position: relative; }
  input[type="search"] {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 11px 14px 11px 36px; border-radius: 12px; font: inherit; font-size: .88rem; width: 280px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-top: 30px; }
  .stat { font-size: .76rem; color: var(--muted); padding: 15px 17px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .stat strong { display: block; font-size: 1.45rem; color: var(--text); letter-spacing: -.04em; margin-bottom: 2px; }
  .chips { display: flex; gap: 8px; margin: 24px 0 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    padding: 7px 13px; border-radius: 999px; font-size: .8rem; cursor: pointer; font: inherit;
    transition: background-color .15s, color .15s, border-color .15s, transform .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dashboard { max-width: 1280px; margin: 0 auto; padding: 14px 24px 64px; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; }
  .sidebar { align-self: start; position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .sidebar-summary { padding: 16px; border-bottom: 1px solid var(--border); }
  .eyebrow { margin: 0 0 7px; color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .sidebar-name { margin: 0; font-size: 1rem; line-height: 1.3; }
  .sidebar-meta { margin: 5px 0 0; color: var(--muted); font-size: .75rem; }
  .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-section:last-child { border-bottom: 0; }
  .sidebar-label { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .73rem; }
  .sidebar-label strong { color: var(--text); font-size: .78rem; }
  .progress-track { height: 7px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
  .progress-value { height: 100%; min-width: 0; border-radius: inherit; background: var(--accent); }
  .sidebar-note { margin: 8px 0 0; color: var(--muted); font-size: .71rem; line-height: 1.4; }
  .security-status { display: flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 650; }
  .security-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .security-clear .security-dot { background: var(--security-clear); }
  .security-attention .security-dot { background: var(--security-attention); }
  .security-critical .security-dot { background: var(--security-critical); }
  .project-list { max-height: 340px; overflow: auto; padding: 8px; }
  .project-select { display: block; width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--muted); text-align: left; font: inherit; font-size: .76rem; cursor: pointer; }
  .project-select:hover { color: var(--text); background: var(--surface-2); }
  .project-select[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--text); font-weight: 650; }
  main { min-width: 0; }
  .audit-page { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  .audit-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .audit-title { margin: 0; font-size: 1.4rem; letter-spacing: -.025em; }
  .audit-sub { margin: 7px 0 0; color: var(--muted); font-size: .82rem; }
  .audit-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(220px, .65fr); gap: 16px; margin-top: 20px; }
  .audit-panel { padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-raised); }
  .audit-panel h3 { margin: 0; font-size: .9rem; }
  .audit-panel p { margin: 8px 0 0; color: var(--muted); font-size: .78rem; line-height: 1.45; }
  .audit-field { display: grid; gap: 7px; margin-top: 16px; color: var(--muted); font-size: .75rem; }
  .audit-field input { width: 100%; padding: 10px 11px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; font: inherit; }
  .audit-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .audit-btn { padding: 8px 11px; border: 1px solid var(--border); border-radius: 9px; color: var(--text); background: var(--surface); cursor: pointer; font: inherit; font-size: .76rem; font-weight: 650; }
  .audit-btn.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
  .audit-files { margin: 13px 0 0; padding-left: 18px; color: var(--muted); font-size: .76rem; line-height: 1.7; }
  .audit-note { margin-top: 12px; font-size: .76rem; color: var(--muted); }
  .audit-note.loading { color: var(--accent); }
  .audit-note.ok { color: var(--security-clear); }
  .audit-note.error { color: var(--security-critical); }
  .audit-result { margin-top: 14px; }
  .audit-result > p { color: var(--muted); font-size: .76rem; margin: 8px 0; }
  .audit-result details { margin-top: 8px; }
  .audit-result summary { cursor: pointer; color: var(--accent); font-size: .76rem; }
  .audit-raw { max-height: 280px; overflow: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px; font-size: .72rem; color: var(--muted); white-space: pre-wrap; }
  .audit-editor { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  .audit-field select, .audit-field textarea { width: 100%; padding: 10px 11px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; font: inherit; }
  .audit-field textarea { resize: vertical; line-height: 1.5; }
  .audit-btn:disabled { opacity: .55; cursor: progress; }
  .group-title {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 30px 0 14px; font-weight: 650; display: flex; align-items: center; gap: 10px;
  }
  .group-title::after { content: ""; height: 1px; background: var(--border); flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s, border-color .15s, box-shadow .15s; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--card-color, var(--accent));
  }
  .card:hover { transform: translateY(-2px); border-color: var(--card-color, var(--accent)); box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-icon {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    background: color-mix(in srgb, var(--card-color, var(--accent)) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--card-color, var(--accent)) 20%, var(--border)); font-size: 16px;
  }
  .card-name { font-weight: 650; font-size: .98rem; letter-spacing: -.01em; line-height: 1.25; }
  .card-tagline { color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .badge {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  }
  .s-active { background: rgba(16,185,129,.15); color: #34d399; }
  .s-maintenance { background: rgba(245,158,11,.15); color: #fbbf24; }
  .s-archived { background: rgba(100,116,139,.2); color: #94a3b8; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: .68rem; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .68rem; color: var(--muted); }
  .open {
    font-size: .74rem; font-weight: 650; padding: 7px 11px; border-radius: 9px;
    background: color-mix(in srgb, var(--card-color, var(--accent)) 16%, transparent);
    color: var(--card-color, var(--accent)); border: 1px solid transparent; cursor: pointer; font-family: inherit;
  }
  .open:hover { border-color: var(--card-color, var(--accent)); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  footer {
    border-top: 1px solid var(--border); padding: 20px 24px; text-align: center;
    color: var(--muted); font-size: .76rem;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface-2); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 10px; font-size: .82rem; opacity: 0; transition: all .22s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 960px) { .dashboard { grid-template-columns: 232px minmax(0, 1fr); gap: 16px; } }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dashboard { grid-template-columns: 1fr; } .sidebar { position: static; } .project-list { max-height: 220px; } .audit-grid { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {
    header { padding: 22px 16px 0; }
    .dashboard { padding: 12px 16px 48px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 22px; }
    .stat { padding: 12px 14px; }
    .topbar { align-items: flex-start; }
    .controls { width: 100%; }
    .group-title { margin-top: 25px; }
    .grid { grid-template-columns: 1fr; }
    .audit-page { padding: 16px; }
    .audit-top { display: grid; }
    input[type="search"] { width: 100%; }
    .search { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo">🚀</div>
      <div>
        <h1>Super Apps</h1>
        <div class="sub">Amirul Putra Justicia · personal project hub</div>
      </div>
    </div>
    <div class="controls">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari project, stack, tag…" autocomplete="off" aria-label="Cari project" />
      </div>
      <button class="icon-btn" id="theme" title="Ganti tema" aria-label="Ganti tema">🌙</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter kategori"></div>
</header>
<div class="dashboard">
  <aside class="sidebar" aria-label="Ringkasan project">
    <div id="project-summary"></div>
    <div class="sidebar-section">
      <p class="eyebrow">Daftar project</p>
      <div class="project-list" id="project-list"></div>
    </div>
  </aside>
  <main>
    <div id="content"></div>
    <div class="empty" id="empty" hidden>Tidak ada project yang cocok dengan pencarian.</div>
  </main>
</div>
<footer>
  © 2026 Amirul Putra Justicia · Fullstack Developer / Engineer / Web System / Govtech · <span id="foot-count"></span>
</footer>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
