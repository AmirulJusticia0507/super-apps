<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Super Apps — Amirul Putra Justicia</title>
<meta name="description" content="Katalog & launcher super apps untuk seluruh project personal Amirul Putra Justicia." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
<style>
  :root {
    --bg: #0b0f17;
    --surface: #121826;
    --surface-2: #1a2233;
    --border: #243044;
    --text: #e8eef7;
    --muted: #8fa0b8;
    --accent: #6366f1;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  [data-theme="light"] {
    --bg: #f6f8fc; --surface: #ffffff; --surface-2: #eef2f9;
    --border: #dce4f0; --text: #101828; --muted: #5a6b85;
    --shadow: 0 8px 24px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  header { padding: 28px 24px 0; max-width: 1280px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #ec4899); font-size: 22px;
  }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { position: relative; }
  input[type="search"] {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 14px 9px 34px; border-radius: 10px; font: inherit; font-size: .88rem; width: 240px;
  }
  input[type="search"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 16px;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .stats { display: flex; gap: 18px; margin-top: 22px; flex-wrap: wrap; }
  .stat { font-size: .78rem; color: var(--muted); }
  .stat strong { display: block; font-size: 1.4rem; color: var(--text); letter-spacing: -.02em; }
  .chips { display: flex; gap: 8px; margin: 22px 0 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    padding: 7px 13px; border-radius: 999px; font-size: .8rem; cursor: pointer; font: inherit;
    transition: all .15s;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 24px 64px; }
  .group-title {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); margin: 28px 0 12px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, border-color .15s, box-shadow .15s; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--card-color, var(--accent));
  }
  .card:hover { transform: translateY(-2px); border-color: var(--card-color, var(--accent)); box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: flex-start; gap: 10px; }
  .card-icon {
    width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; display: grid; place-items: center;
    background: color-mix(in srgb, var(--card-color, var(--accent)) 18%, transparent); font-size: 16px;
  }
  .card-name { font-weight: 650; font-size: .98rem; letter-spacing: -.01em; line-height: 1.25; }
  .card-tagline { color: var(--muted); font-size: .8rem; line-height: 1.45; }
  .badge {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
    padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  }
  .s-active { background: rgba(16,185,129,.15); color: #34d399; }
  .s-maintenance { background: rgba(245,158,11,.15); color: #fbbf24; }
  .s-archived { background: rgba(100,116,139,.2); color: #94a3b8; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: .68rem; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--border);
  }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .68rem; color: var(--muted); }
  .open {
    font-size: .74rem; font-weight: 600; padding: 6px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--card-color, var(--accent)) 16%, transparent);
    color: var(--card-color, var(--accent)); border: 1px solid transparent; cursor: pointer; font-family: inherit;
  }
  .open:hover { border-color: var(--card-color, var(--accent)); }
  .empty { text-align: center; padding: 70px 20px; color: var(--muted); }
  footer {
    border-top: 1px solid var(--border); padding: 20px 24px; text-align: center;
    color: var(--muted); font-size: .76rem;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface-2); border: 1px solid var(--border); padding: 10px 18px;
    border-radius: 10px; font-size: .82rem; opacity: 0; transition: all .22s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 560px) {
    input[type="search"] { width: 100%; }
    .search { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo">🚀</div>
      <div>
        <h1>Super Apps</h1>
        <div class="sub">Amirul Putra Justicia · personal project hub</div>
      </div>
    </div>
    <div class="controls">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari project, stack, tag…" autocomplete="off" aria-label="Cari project" />
      </div>
      <button class="icon-btn" id="theme" title="Ganti tema" aria-label="Ganti tema">🌙</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter kategori"></div>
</header>
<main>
  <div id="content"></div>
  <div class="empty" id="empty" hidden>Tidak ada project yang cocok dengan pencarian.</div>
</main>
<footer>
  <span id="foot-count"></span> · Dikelola dari <code>projects.manifest.json</code> · Super Apps v1.0.0
</footer>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
