# Docker Compose opsional untuk Super Apps.
# Hanya Nginx + volume read-only ke folder hub. Tanpa build, tanpa dependency.
#
#   docker compose -f infra/docker-compose.yml up -d
#   → http://localhost:8088
#
# Catatan: manifest hanya berisi metadata; folder project lain TIDAK di-mount.

services:
  super-apps:
    image: nginx:1.27-alpine
    container_name: super-apps
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
